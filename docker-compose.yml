version: '3.8'

services:
  xiaoheihe-favourites:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaoheihe-favourites
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FORCE_AUTHN_INNERAPI_DOMAIN=http://localhost:3000
      - DISABLE_DATAPASS=true
      - DEPRECATED_SKIP_INIT_DB_CONNECTION=true
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/archives/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - xiaoheihe-network

networks:
  xiaoheihe-network:
    driver: bridge
